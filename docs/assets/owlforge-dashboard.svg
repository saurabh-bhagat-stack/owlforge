<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" role="img" aria-label="owlforge interactive dashboard">
  <style>
    .t{font-size:12.5px}.s{font-size:11px}.dim{fill:#7b8aa0}.am{fill:#fbbf24}.gn{fill:#34d399}
    .yl{fill:#fcd34d}.rd{fill:#f87171}.wh{fill:#d7e0ee}.cy{fill:#67e8f9}.mg{fill:#e879f9}.b{font-weight:700}
    .lbl{fill:#9a7b4f;font-size:11px;font-weight:700}
  </style>
  <rect width="1000" height="640" rx="12" fill="#0d1526"/>
  <!-- window chrome -->
  <rect width="1000" height="30" rx="12" fill="#101c30"/>
  <circle cx="20" cy="15" r="5" fill="#f87171"/><circle cx="38" cy="15" r="5" fill="#fbbf24"/><circle cx="56" cy="15" r="5" fill="#34d399"/>
  <text x="80" y="19" class="s dim">owlforge run http://burpbountylab.com/ -D</text>

  <!-- STATUS + PROGRESS -->
  <rect x="12" y="40" width="976" height="48" rx="8" fill="#141f36" stroke="#5a3a12"/>
  <text x="26" y="60" class="t"><tspan class="am b">owlforge</tspan><tspan class="wh">  http://burpbountylab.com/</tspan><tspan class="dim">   beam:cloud</tspan></text>
  <text x="26" y="78" class="t"><tspan class="yl b">phase hunt</tspan><tspan class="dim">  02:59  </tspan></text>
  <rect x="150" y="69" width="150" height="9" rx="4" fill="#24314d"/><rect x="150" y="69" width="70" height="9" rx="4" fill="#fbbf24"/>
  <text x="320" y="78" class="t"><tspan class="gn b">6 validated</tspan><tspan class="dim"> / 19 candidate    sort:sev</tspan></text>

  <!-- LEFT: narrative activity -->
  <rect x="12" y="96" width="600" height="470" rx="8" fill="#0f1a30" stroke="#5a3a12"/>
  <g class="t">
    <text x="26" y="120"><tspan class="gn b">✓ confirmed</tspan><tspan class="wh">  OS command injection in /rce/ping (host)</tspan></text>
    <text x="26" y="140"><tspan class="gn b">✓ confirmed</tspan><tspan class="wh">  Python eval RCE in /rce/eval (code)</tspan></text>
    <text x="26" y="160"><tspan class="am b">SQL injection ▸</tspan><tspan class="wh"> pre-probe confirmed a finding</tspan></text>
    <text x="26" y="180"><tspan class="am b">SQL injection ▸</tspan><tspan class="wh"> testing 2 target(s)</tspan></text>
    <text x="26" y="202"><tspan class="cy b">thinking</tspan><tspan class="dim">  primary targets /sqli/search (q), /sqli/length (q);</tspan></text>
    <text x="42" y="218" class="s dim">confirm with the 200→500→200 pattern on a single quote</text>
    <text x="26" y="240"><tspan class="dim">   probe </tspan><tspan class="wh">GET /sqli/search?q='</tspan></text>
    <text x="42" y="256"><tspan class="dim">     → </tspan><tspan class="yl">500</tspan></text>
    <text x="26" y="276"><tspan class="dim">   probe </tspan><tspan class="wh">GET /sqli/search?q=''</tspan></text>
    <text x="42" y="292"><tspan class="dim">     → </tspan><tspan class="wh">200  (balances the error)</tspan></text>
    <text x="26" y="314"><tspan class="gn b">✓ confirmed</tspan><tspan class="wh">  SQL injection (error-based)</tspan></text>
    <text x="26" y="334"><tspan class="am">   deepen </tspan><tspan class="wh">sqlmap → PostgreSQL, user app_ro</tspan></text>
    <text x="26" y="356"><tspan class="cy b">ssrf ▸</tspan><tspan class="wh"> /redirect/out?url= fetched my host → OAST wait…</tspan></text>
    <text x="26" y="376"><tspan class="gn b">✓ confirmed</tspan><tspan class="wh">  Blind SSRF via 'url' (callback received)</tspan></text>
    <text x="26" y="398"><tspan class="mg b">steer</tspan><tspan class="wh">  focus on the GraphQL API next</tspan></text>
    <text x="26" y="418"><tspan class="cy">graphql</tspan><tspan class="wh">  introspection OPEN — enumerating mutations</tspan></text>
    <text x="26" y="440" class="dim">… (scroll · L = raw tool log)</text>
  </g>

  <!-- RIGHT TOP: findings -->
  <rect x="624" y="96" width="364" height="196" rx="8" fill="#0f1a30" stroke="#5a3a12"/>
  <text x="638" y="114" class="lbl">SEV   STATUS  FINDING</text>
  <g class="s">
    <text x="638" y="136"><tspan class="rd b">CRIT</tspan><tspan class="gn">  valid </tspan><tspan class="wh"> OS command injection / RCE</tspan></text>
    <text x="638" y="154"><tspan class="rd b">CRIT</tspan><tspan class="gn">  valid </tspan><tspan class="wh"> Python eval RCE /rce/eval</tspan></text>
    <text x="638" y="172"><tspan class="rd">HIGH</tspan><tspan class="gn">  valid </tspan><tspan class="wh"> SQL injection (error-based)</tspan></text>
    <text x="638" y="190"><tspan class="rd">HIGH</tspan><tspan class="gn">  valid </tspan><tspan class="wh"> Blind SSRF via 'url'</tspan></text>
    <text x="638" y="208"><tspan class="yl">MED </tspan><tspan class="gn">  valid </tspan><tspan class="wh"> GraphQL introspection</tspan></text>
    <text x="638" y="226"><tspan class="yl">MED </tspan><tspan class="yl">  cand  </tspan><tspan class="wh"> CSRF: token not enforced</tspan></text>
    <text x="638" y="244"><tspan class="cy">LOW </tspan><tspan class="yl">  cand  </tspan><tspan class="wh"> Missing CSP (site-wide)</tspan></text>
    <text x="638" y="268" class="dim">↑↓ · enter = details · / filter · s sort · v sev</text>
  </g>

  <!-- RIGHT MID: current target -->
  <rect x="624" y="300" width="364" height="112" rx="8" fill="#0f1a30" stroke="#24314d"/>
  <text x="638" y="320" class="lbl">CURRENT TARGET</text>
  <text x="638" y="342" class="t cy">GET /sqli/search</text>
  <text x="638" y="362" class="s"><tspan class="dim">params: </tspan><tspan class="wh">q</tspan></text>
  <text x="638" y="382" class="s dim">class SQL injection   ·   turn 13/15</text>

  <!-- RIGHT BOT: surface -->
  <rect x="624" y="420" width="364" height="146" rx="8" fill="#0f1a30" stroke="#24314d"/>
  <text x="638" y="438" class="lbl">SURFACE   ENDPOINT                 PARAMS</text>
  <g class="s">
    <text x="638" y="458"><tspan class="cy">GET /sqli/search</tspan><tspan class="dim">            q</tspan></text>
    <text x="638" y="474"><tspan class="cy">GET /xss/discover</tspan><tspan class="dim">           q,name,view</tspan></text>
    <text x="638" y="490"><tspan class="cy">GET /rce/ping</tspan><tspan class="dim">              host,count</tspan></text>
    <text x="638" y="506"><tspan class="cy">POST /graphql</tspan><tspan class="dim">              query</tspan></text>
    <text x="638" y="522"><tspan class="cy">GET /api/v1/users</tspan><tspan class="dim">          id</tspan></text>
    <text x="638" y="544" class="dim">… 128 discovered endpoints</text>
  </g>

  <!-- STEER input (bottom) -->
  <rect x="12" y="574" width="976" height="30" rx="8" fill="#0f1a30" stroke="#5a3a12"/>
  <text x="26" y="593" class="t dim">steer the scan — type a note, Enter to send</text>
  <text x="12" y="626" class="s dim">   narrative feed · live findings · current target · discovered surface · steer · Ctrl+Q quit · L raw log</text>
</svg>
