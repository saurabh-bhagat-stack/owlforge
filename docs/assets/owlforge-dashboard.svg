<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" role="img" aria-label="owlforge interactive dashboard">
  <style>
    .t{font-size:13px} .dim{fill:#5b7891} .cy{fill:#22d3ee} .gn{fill:#34d399} .yl{fill:#fbbf24}
    .rd{fill:#f87171} .wh{fill:#cbd5e1} .b{font-weight:700}
  </style>
  <rect width="920" height="520" rx="12" fill="#0b1220"/>
  <!-- window chrome -->
  <rect width="920" height="30" rx="12" fill="#0e1a2b"/>
  <circle cx="20" cy="15" r="5" fill="#f87171"/><circle cx="38" cy="15" r="5" fill="#fbbf24"/><circle cx="56" cy="15" r="5" fill="#34d399"/>
  <text x="78" y="19" class="t dim">owlforge run http://target.example -D</text>

  <!-- status bar -->
  <rect x="12" y="40" width="896" height="46" rx="8" fill="none" stroke="#1e3a5f"/>
  <text x="26" y="60" class="t"><tspan class="cy b">owlforge</tspan><tspan class="wh">  http://target.example</tspan></text>
  <text x="26" y="78" class="t"><tspan class="yl b">phase hunt</tspan><tspan class="dim">   02:14   </tspan><tspan class="gn b">41 validated</tspan><tspan class="dim"> / </tspan><tspan class="yl">7 candidate</tspan></text>

  <!-- findings panel -->
  <rect x="12" y="96" width="560" height="384" rx="8" fill="none" stroke="#2dd4bf" stroke-opacity="0.5"/>
  <text x="26" y="114" class="t dim">findings (48)</text>
  <text x="26" y="138" class="t dim">SEV       STATUS     FINDING</text>
  <g class="t">
    <text x="26" y="160"><tspan class="rd b">CRITICAL</tspan><tspan class="gn">  validated </tspan><tspan class="wh"> OS command injection / RCE</tspan></text>
    <text x="26" y="180"><tspan class="rd b">CRITICAL</tspan><tspan class="gn">  validated </tspan><tspan class="wh"> Blind OS command / template inj</tspan></text>
    <text x="26" y="200"><tspan class="rd">HIGH    </tspan><tspan class="gn">  validated </tspan><tspan class="wh"> XSS (browser-confirmed)</tspan></text>
    <text x="26" y="220"><tspan class="rd">HIGH    </tspan><tspan class="gn">  validated </tspan><tspan class="wh"> SQL injection (error-based)</tspan></text>
    <text x="26" y="240"><tspan class="rd">HIGH    </tspan><tspan class="gn">  validated </tspan><tspan class="wh"> XML external entity (XXE)</tspan></text>
    <text x="26" y="260"><tspan class="rd">HIGH    </tspan><tspan class="gn">  validated </tspan><tspan class="wh"> Blind SSRF via 'url'</tspan></text>
    <text x="26" y="280"><tspan class="rd">HIGH    </tspan><tspan class="gn">  validated </tspan><tspan class="wh"> Path traversal / LFI</tspan></text>
    <text x="26" y="300"><tspan class="rd">HIGH    </tspan><tspan class="yl">  candidate </tspan><tspan class="wh"> Reflected XSS</tspan></text>
    <text x="26" y="320"><tspan class="yl">MEDIUM  </tspan><tspan class="gn">  validated </tspan><tspan class="wh"> GraphQL introspection enabled</tspan></text>
    <text x="26" y="340"><tspan class="yl">MEDIUM  </tspan><tspan class="yl">  candidate </tspan><tspan class="wh"> CSRF: anti-CSRF not enforced</tspan></text>
    <text x="26" y="360"><tspan class="cy">LOW     </tspan><tspan class="yl">  candidate </tspan><tspan class="wh"> Missing Content-Security-Policy</tspan></text>
  </g>
  <rect x="556" y="150" width="4" height="60" rx="2" fill="#2dd4bf" fill-opacity="0.6"/>
  <text x="26" y="462" class="t dim">↑/↓ scroll · enter/click = details · q quit</text>

  <!-- event log panel -->
  <rect x="580" y="96" width="328" height="384" rx="8" fill="none" stroke="#1e3a5f"/>
  <text x="592" y="114" class="t dim">events</text>
  <g class="t" font-size="11.5">
    <text x="592" y="138"><tspan class="cy">[status]</tspan><tspan class="wh"> [specialist:rce] testing</tspan></text>
    <text x="592" y="156"><tspan class="dim">[status] turn 3/15</tspan></text>
    <text x="592" y="174"><tspan class="yl">[tool_call]</tspan><tspan class="wh"> http_request GET</tspan></text>
    <text x="592" y="192"><tspan class="gn">[tool_result]</tspan><tspan class="wh"> 200 text/html</tspan></text>
    <text x="592" y="210"><tspan class="rd b">[finding]</tspan><tspan class="wh"> candidate: OS cmd inj</tspan></text>
    <text x="592" y="228"><tspan class="gn b">[finding_validated]</tspan><tspan class="wh"> RCE</tspan></text>
    <text x="592" y="246"><tspan class="dim">[status] deepened: RCE</tspan></text>
    <text x="592" y="264"><tspan class="cy">[status]</tspan><tspan class="wh"> [specialist:ssrf]</tspan></text>
    <text x="592" y="282"><tspan class="gn">[tool_result]</tspan><tspan class="wh"> oast callback hit</tspan></text>
    <text x="592" y="300"><tspan class="gn b">[finding_validated]</tspan><tspan class="wh"> SSRF</tspan></text>
    <text x="592" y="318"><tspan class="dim">[status] validation — 41 ok</tspan></text>
    <text x="592" y="336"><tspan class="dim">[status] collapse — merged 15</tspan></text>
  </g>
  <text x="26" y="504" class="t dim"> q Quit   d Details                                          owlforge v0.1.0</text>
</svg>
