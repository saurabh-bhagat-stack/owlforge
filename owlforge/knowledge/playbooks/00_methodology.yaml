name: methodology
title: Assessment methodology (read first)
priority: 0
body: |
  Work SYSTEMATICALLY. Do NOT fixate on the most obvious input (e.g. a search box) —
  that is the single most common reason real bugs are missed.

  1. MAP the attack surface FIRST. Enumerate EVERY input point before testing any:
     - every query parameter (e.g. category, id, productId, sort, filter, redirect,
       page, lang), not just one;
     - path segments; POST form fields; and where relevant headers
       (User-Agent, Referer, X-Forwarded-For) and cookies.
     Fetch pages and extract links/forms/params to build this inventory.
  2. BREADTH BEFORE DEPTH. Touch every parameter once with a quick probe before going
     deep on any single one. The vulnerable parameter is often NOT the obvious one.
  3. EVIDENCE ONLY. Base every claim on actual tool output. A payload reflected
     HTML-ENCODED (e.g. &lt;) is sanitized and NOT exploitable — only raw/executed
     output counts.
  4. CONFIRM BEFORE FILING. Never file something you could not reproduce.
     Your repro_command is RE-RUN by a validator and must PRINT the success_signal:
       - Use the EXACT request that produced your observation — same parameter and the
         same payload. Do NOT substitute a different payload in the repro.
       - For a status-code signal, make curl print the code and nothing else:
           curl -s -o /dev/null -w '%{http_code}' "<FULL URL WITH PAYLOAD>"
         and set success_signal to that code (e.g. "500").
       - For a content signal (SQL error text, /etc/passwd marker, raw XSS payload),
         make the repro output that text and set success_signal to it.
