name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest

  # TODO(Phase 2): build & push ghcr.io/saurabh-bhagat-stack/owlforge-sandbox on tags
  # using docker/build-push-action + buildx (arm64 + amd64), auth via GITHUB_TOKEN.
